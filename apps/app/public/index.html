<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OrganIO</title>
    <meta name="description" content="Tareas y rutinas que no se te escapan." />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12151C" media="(prefers-color-scheme: dark)" />
    <!-- iPhone: «Añadir a pantalla de inicio» abre OrganIO a pantalla completa, como una app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OrganIO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; margin: 0; background: #F4F5F7; -webkit-text-size-adjust: 100%; }
      @media (prefers-color-scheme: dark) { body { background: #12151C; } }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>OrganIO necesita JavaScript para funcionar.</noscript>
    <div id="root"></div>
